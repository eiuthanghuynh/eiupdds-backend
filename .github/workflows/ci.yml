name: EIU PDDS CI Pipeline

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Verify Database Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET Local Tools
        run: dotnet tool restore

      - name: Verify Code Formatting
        run: dotnet format eiupdds-backend.slnx --verify-no-changes --verbosity normal

      - name: Restore Dependencies
        run: dotnet restore eiupdds-backend.slnx

      - name: Build Solution (Release)
        run: dotnet build eiupdds-backend.slnx --configuration Release --no-restore

      - name: Run Unit & Model Tests
        run: dotnet test eiupdds-backend.slnx --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed"

      - name: Verify Database Model Integrity (No Pending Changes)
        run: dotnet ef migrations has-pending-model-changes --project eiupdds-backend.csproj

      - name: Verify Migration Script Generation (Idempotent SQL)
        run: dotnet ef migrations script --idempotent --project eiupdds-backend.csproj --output migrations.sql

      - name: Upload Migration SQL Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-migration-script
          path: migrations.sql
          if-no-files-found: ignore
